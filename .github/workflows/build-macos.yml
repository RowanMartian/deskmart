name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --no-default-features

      - name: Build Deskmart.app
        env:
          # Lets the app's update checker compare itself with the latest release of this repo.
          DESKMART_REPO: ${{ github.repository }}
          DESKMART_COMMIT: ${{ github.sha }}
          # Optional: a stable signing certificate so permissions survive updates (scripts/make-signing-cert.sh).
          DESKMART_SIGNING_P12: ${{ secrets.DESKMART_SIGNING_P12 }}
          DESKMART_SIGNING_PASSWORD: ${{ secrets.DESKMART_SIGNING_PASSWORD }}
        run: bash scripts/bundle-macos.sh

      - name: Smoke test (the helper starts and answers)
        run: |
          dist/Deskmart.app/Contents/MacOS/Deskmart --server-only --port 47399 &
          for i in $(seq 1 20); do curl -fsS http://localhost:47399/api/hello && break; sleep 0.5; done
          dist/Deskmart.app/Contents/MacOS/Deskmart list /Applications | tail -3
          kill %1

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: Deskmart-mac
          path: dist/Deskmart.dmg

      - name: Publish to the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Deskmart.dmg dist/Deskmart-mac.zip \
            --title "Deskmart — latest build" \
            --target "$GITHUB_SHA" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download **Deskmart.dmg**, open it, and drag Deskmart into Applications."
