      $$('[data-addbtn]', form).forEach((b) => b.onclick = async () => { const k = b.dataset.addbtn; const v = form.querySelector(`[data-add=${k}]`).value.trim(); if (!v) return; const p = v.startsWith('~') ? HOME + v.slice(1) : v; if (!(cur[k] || []).includes(p)) await save({ [k]: [...(cur[k] || []), p] }); if (k === 'appFolders') S.apps = null; draw(); });
      $$('[data-add]', form).forEach((i) => i.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); form.querySelector(`[data-addbtn=${i.dataset.add}]`).click(); } });
      $$('[data-unlink]', form).forEach((b) => b.onclick = async () => { await api('POST', 'link', null, { app: b.dataset.unlink, paths: [b.dataset.p], unlink: true }); await refreshDisk(); cur = { ...S.settings }; draw(); });
      const un = $('#s-unskip', form); if (un) un.onclick = async () => { await save({ updaterIgnored: [] }); draw(); };
    };
    $$('#s-tabs button', form).forEach((b) => b.onclick = () => { tab = b.dataset.t; draw(); });
    draw();
  } });
  if (S.page === 'apps' && !S.detail) go('apps');
  renderSidebar();
}

async function permissionsDlg() {
  let p;
  try { p = await api('GET', 'permissions'); } catch (e) { return showError(e); }
  S.st.fullDiskAccess = p.fullDiskAccess; renderPermDot();
  const gg = p.macosMajor >= 27;
  const status = p.fullDiskAccess === true ? '<i class="bdg green">On</i>' : p.fullDiskAccess === false ? '<i class="bdg orange">Off</i>' : '<i class="bdg">Unknown</i>';
  const html = `<div class="set-row"><div class="t"><b>Full Disk Access ${status}</b><small>Lets Deskmart look in every Library folder, including other apps’ containers.${gg ? ' On macOS 27 Golden Gate, apps can’t read other apps’ data at all without it.' : ''}</small></div><button type="button" class="btn sm" data-open="fda">Open Settings</button></div>
    <div class="set-row"><div class="t"><b>App Management</b><small>Lets Deskmart move other apps to the Trash and slim them with Lipo. macOS asks the first time; if it was denied, turn it on here.</small></div><button type="button" class="btn sm" data-open="appManagement">Open Settings</button></div>
    <div class="set-row"><div class="t"><b>Administrator password</b><small>Files owned by the system (in /Library) are moved with the standard macOS password prompt. Deskmart never sees your password.</small></div></div>
    <p class="hint" style="margin-top:10px">In System Settings, click <b>+</b> and choose Deskmart in Applications, then switch it on. After each Deskmart update you may need to turn it off and on again, because the GitHub build isn't signed with an Apple developer certificate.</p>`;
  const r = await modal({ title: 'Permissions', html, wide: true, icon: `<img src="/icon.svg" alt="">`, buttons: [{ label: 'Check Again', value: 'again', left: true }, { label: 'Done', value: true, primary: true }],
    onOpen: (form) => $$('[data-open]', form).forEach((b) => b.onclick = () => api('POST', 'permissions/open', null, { which: b.dataset.open === 'fda' ? 'fullDiskAccess' : b.dataset.open })) });
  if (r && r.value === 'again') return permissionsDlg();
}

async function historyDlg() {
  let h;
  try { h = await api('GET', 'history'); } catch (e) { return showError(e); }
  const recs = h.records;
  if (!recs.length) return okDlg('Restore Deleted Files', 'Nothing yet. Every time Deskmart moves files to the Trash, they show up here so you can put them back. The last 10 are kept.');
  const checked = new Set();
  const r = await modal({ title: 'Restore Deleted Files', wide: true, html: `<p>Put files back where they were. The last 10 removals are listed while their files are still in the Trash.</p><div class="dlist" id="h-rows"></div>`,
    buttons: [{ label: 'Empty Trash…', value: 'empty', left: true }, { label: 'Close', value: null }, { label: 'Restore', value: 'restore', primary: true }],
    onOpen: (form) => {
      const draw = () => {
        $('#h-rows', form).innerHTML = recs.map((x) => `<label class="row${x.available ? '' : ' off'}" data-id="${x.id}" style="grid-template-columns:30px minmax(0,1fr) auto"><div><input type="checkbox" class="cb" ${checked.has(x.id) ? 'checked' : ''} ${x.available ? '' : 'disabled'}></div>
          <div class="c-name"><div class="two"><span class="nm">${esc(x.name)}</span><small>${fmtDate(x.time)} · ${plural(x.count, 'item')}${x.available < x.count ? ` · ${x.count - x.available} no longer in the Trash` : ''}</small></div></div><div class="c-r c-dim">${fmtSize(x.size)}</div></label>`).join('');
        $$('#h-rows input', form).forEach((i) => i.onchange = () => { const id = i.closest('[data-id]').dataset.id; i.checked ? checked.add(id) : checked.delete(id); });
      };
      draw();
    } });
  if (!r) return;
  if (r.value === 'restore') { if (checked.size) restore([...checked]); }
  if (r.value === 'empty') {
    const ok = await confirmDlg('Empty the Trash?', 'Everything in the Trash is deleted for good, including files Deskmart moved there. This can’t be undone.', 'Empty Trash', true);
    if (ok) { try { await api('POST', 'trash/empty'); toast('Trash emptied'); refreshDisk(); } catch (e) { showError(e); } }
  }
}

/* ------------------------------------------------------------ console */
let conAfter = 0, conTimer = null;
function toggleConsole(show) {
  const el = $('#console'); el.hidden = show === undefined ? !el.hidden : !show;
  clearInterval(conTimer);
  if (!el.hidden) { pollConsole(); conTimer = setInterval(pollConsole, 1000); }
}
async function pollConsole() {
  try {
    const { lines } = await api('GET', 'console', { after: conAfter });
    if (!lines.length) return;
    conAfter = lines[lines.length - 1].id;
    const body = $('#con-body'); const atEnd = body.scrollTop + body.clientHeight >= body.scrollHeight - 20;
    body.insertAdjacentHTML('beforeend', lines.map((l) => `<div><span class="src">[${esc(l.source)}]</span> ${esc(l.text)}</div>`).join(''));
    while (body.childElementCount > 800) body.firstElementChild.remove();
    if (atEnd) body.scrollTop = body.scrollHeight;
  } catch {}
}
$('#con-close').innerHTML = I.x; $('#con-clear').innerHTML = fa('eraser', 12);
$('#con-close').onclick = () => toggleConsole(false);
$('#con-clear').onclick = () => { $('#con-body').innerHTML = ''; };

/* ------------------------------------------------------------ self update (same as Dropfin) */
async function checkSelfUpdate(manual) {
  try {
    const u = await api('GET', 'update', manual ? { force: 1 } : null); S.update = u;
    $('#upd-dot').hidden = !u.available;
    if (!manual) return;
    if (!u.enabled) return okDlg('Updates', 'This copy of Deskmart wasn’t built by GitHub, so it can’t check for updates.');
    if (u.available) return updateDlg();
    okDlg(u.reachable ? 'You’re up to date' : 'Couldn’t check', u.reachable ? `Deskmart ${u.current} is the latest build.` : 'GitHub couldn’t be reached. If the repository is private, the check can’t see its releases.');
  } catch (e) { if (manual) showError(e); }
}
async function updateDlg() {
  const inPlace = S.st && S.st.selfUpdate;
  const r = await modal({ title: 'A new Deskmart is available',
    message: inPlace ? 'Deskmart downloads the new build, checks it, moves this copy to the Trash and reopens. Your settings stay.'
      : 'Download Deskmart.dmg from the release page, open it, and drag Deskmart into Applications to replace this one. Your settings stay.',
    icon: '<img src="/icon.svg" alt="">',
    buttons: inPlace ? [{ label: 'Release Page', value: 'page', left: true }, { label: 'Later', value: null }, { label: 'Update and Relaunch', value: 'install', primary: true }]
      : [{ label: 'Later', value: null }, { label: 'Open Release Page', value: 'page', primary: true }] });
  if (!r) return;
  if (r.value === 'page') return api('POST', 'update/open');
  let task;
  try { task = (await api('POST', 'update/install')).task; } catch (e) { return showError(e); }
  modal({ title: 'Updating Deskmart', icon: '<img src="/icon.svg" alt="">', html: '<p id="su-step">Starting…</p><div class="bar"><i id="su-bar" style="width:0%"></i></div>',
    buttons: [{ label: 'Cancel', value: 'cancel' }], onOpen: async (form, finish) => {
      try {
        await follow(task, { onProgress: (p) => {
          if (!p) return;
          $('#su-step', form).textContent = p.step ? p.step + (p.total ? ` · ${fmtSize(p.done)} of ${fmtSize(p.total)}` : '') + '…' : 'Working…';
          $('#su-bar', form).style.width = p.total ? (100 * p.done / p.total).toFixed(1) + '%' : p.step === 'Installing' ? '100%' : $('#su-bar', form).style.width;
        } });
        $('#su-step', form).textContent = 'Installed. Deskmart is restarting…';
        $('#su-bar', form).style.width = '100%';
      } catch (e) { finish(null); showError(e); }
    } }).then((x) => { if (x && x.value === 'cancel') api('POST', 'task/stop', null, { id: task }); });
}

/* ------------------------------------------------------------ native hooks: menu commands, dropped apps, links */
window.deskmartCommand = (id) => {
  if (modalOpen && !['settings'].includes(id)) return;
  if (id.startsWith('page:')) return go(id.slice(5));
  switch (id) {
    case 'settings': return settingsDlg();
    case 'permissions': return permissionsDlg();
    case 'history': return historyDlg();
    case 'emptyTrash': return historyDlg();
    case 'checkUpdates': return checkSelfUpdate(true);
    case 'console': return toggleConsole();
    case 'find': { const s = $('#search'); if (s) { s.focus(); s.select(); } return; }
    case 'refresh': { const b = $('#tb-refresh') || $('#tb-scan'); if (b) b.click(); return; }
    case 'viewGrid': case 'viewList': S.view = id === 'viewGrid' ? 'grid' : 'list'; LS.set('view', S.view); return S.page === 'apps' && !S.detail && pageApps();
    case 'uninstall': { if (S.page === 'apps' && S.detail) { const b = $('#d-go'); if (b && !b.disabled) b.click(); } else if (S.page === 'apps' && S.sel.size > 1) bulkUninstall(); return; }
    case 'reveal': if (S.page === 'apps' && S.detail) api('POST', 'reveal', null, { path: S.detail.path }); return;
    case 'export': if (S.page === 'apps' && S.detail) { const m = $('#d-more'); if (m) m.click(); } return;
  }
};
/** Apps dropped on the window, opened with "Open With", or deskmart://uninstall?path=… links. */
window.deskmartOpen = (items) => {
  for (const it of items || []) {
    let path = it, now = false;
    if (/^deskmart:/i.test(it)) {
      try { const u = new URL(it); path = u.searchParams.get('path') || decodeURIComponent(u.pathname.replace(/^\/+/, '/')); now = /uninstall/i.test(u.host || u.pathname); } catch { continue; }
    }
    if (path && path.replace(/\/$/, '').endsWith('.app')) { go('apps'); openApp(path.replace(/\/$/, ''), now); return; }
  }
  if (items && items.length) toast('Drop an app (.app) to see its files', true);
};
document.addEventListener('keydown', (e) => {
  if (modalOpen) return;
  if (!menuEl.hidden) { if (e.key === 'Escape') { e.preventDefault(); hideMenu(); } return; }
  const typing = e.target.closest && e.target.closest('input, textarea, select');
  if (e.key === 'Escape' && S.page === 'apps' && S.detail && !typing) { S.detail = null; pageApps(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') { e.preventDefault(); window.deskmartCommand('find'); }
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); settingsDlg(); }
});
// Dragging an app over the window in a regular browser (the app window handles drops natively).
if (!IS_APP) {
  document.addEventListener('dragover', (e) => { e.preventDefault(); content().classList.add('drop-here'); });
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) content().classList.remove('drop-here'); });
  document.addEventListener('drop', (e) => { e.preventDefault(); content().classList.remove('drop-here'); });
}

/* ------------------------------------------------------------ boot */
async function boot() {
  try {
    const st = await api('GET', 'state');
    S.st = st; S.settings = st.settings; HOME = st.home; S.nativeArch = st.nativeArch;
  } catch (e) { content().innerHTML = emptyBox(I.warn, 'Deskmart isn’t responding', esc(e.message)); return; }
  renderPermDot();
  const startup = S.settings.startupPage || 'apps';
  go(visiblePages().some((p) => p.id === startup) ? startup : 'apps');
  if (window.ipc) window.ipc.postMessage('ready');
  if (S.st.fullDiskAccess === false && !LS.get('permAsked', false)) { LS.set('permAsked', true); setTimeout(permissionsDlg, 600); }
  setTimeout(() => checkSelfUpdate(false), 4000);
  if (S.settings.updaterOnLaunch) setTimeout(backgroundUpdateCheck, 2500);
}
/** "Check for app updates when Deskmart opens": fills the Updater page quietly and shows a count in the sidebar. */
async function backgroundUpdateCheck() {
  const st = S.cache.updater || (S.cache.updater = { items: null, running: false, lines: [], busy: {} });
  if (st.running) return;
  st.running = true;
  try {
    const { task } = await api('POST', 'updater/check');
    const t = await follow(task);
    st.items = t.result.updates; st.checked = t.result.checked; S.cache.updates = st.items;
  } catch {}
  st.running = false;
  renderSidebar();
  if (S.page === 'updater') pageUpdater();
}
boot();
</script>
