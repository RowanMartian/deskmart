<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="deskmart-token" content="__DESKMART_TOKEN__">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#232325" media="(prefers-color-scheme: dark)">
<title>Deskmart</title>
<link rel="stylesheet" href="/fa/fontawesome.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
/* Design tokens: identical to Dropfin so the two apps look like a family. */
:root{
  --bg:#ffffff; --sidebar:#f5f5f7; --panel:#ffffff; --hover:rgba(0,0,0,.045); --sb-active:rgba(0,0,0,.075);
  --border:#e5e5ea; --border-strong:#d2d2d7; --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6;
  --accent:#0a7aff; --accent-soft:rgba(10,122,255,.10); --sel:#0a7aff; --sel-inactive:#e3e3e8;
  --danger:#e5372b; --danger-soft:rgba(229,55,43,.10); --ok:#1f9d48; --ok-soft:rgba(31,157,72,.12); --warn:#c77700; --warn-soft:rgba(230,140,0,.13);
  --input:#ededf0; --input-hover:#e2e2e6; --track:#e5e5ea;
  --folder:#58b0f7; --scrim:rgba(0,0,0,.2); --ql:#f5f5f7;
  --sb-neutral:#7b8594; --sb-movies:#8b78c6; --sb-tv:#4e9a92; --sb-music:#c0808a; --sb-books:#b39252; --sb-photos:#6e9a64;
  --brand:#6a5cff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1c1e; --sidebar:#232325; --panel:#232325; --hover:rgba(255,255,255,.055); --sb-active:rgba(255,255,255,.09);
    --border:#333336; --border-strong:#48484b; --text:#f5f5f7; --text2:#a1a1a6; --text3:#6e6e73;
    --accent:#0a84ff; --accent-soft:rgba(10,132,255,.16); --sel:#0a62d0; --sel-inactive:#3a3a3d;
    --danger:#ff453a; --danger-soft:rgba(255,69,58,.15); --ok:#32d74b; --ok-soft:rgba(50,215,75,.14); --warn:#ffb340; --warn-soft:rgba(255,179,64,.14);
    --input:#2f2f32; --input-hover:#3a3a3d; --track:#3a3a3d;
    --folder:#4aa3ee; --scrim:rgba(0,0,0,.45); --ql:#161618;
    --sb-neutral:#97a0ad; --sb-movies:#a594dc; --sb-tv:#6db7ae; --sb-music:#d59ca4; --sb-books:#cbab6c; --sb-photos:#8bb580;
    --brand:#7d71ff;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default}
input,select,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{flex:none;display:block}
.fx{flex:none;line-height:1;text-align:center}
.fi{width:1.3em}
kbd{font:inherit}
a{color:var(--accent);text-decoration:none}

/* ---------- buttons & fields (Dropfin) ---------- */
.btn{height:30px;padding:0 14px;border-radius:8px;background:var(--input);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.btn:hover:not(:disabled){background:var(--input-hover)}
.btn:disabled{opacity:.5}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent);opacity:.9}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover:not(:disabled){background:var(--danger);opacity:.9}
.btn.big{height:40px;font-size:14px;border-radius:10px}
.btn.sm{height:26px;padding:0 10px;border-radius:7px;font-size:12px}
.field{width:100%;height:34px;border:1px solid var(--border-strong);border-radius:8px;padding:0 11px;background:var(--bg);-webkit-user-select:text;user-select:text}
.field:focus{border-color:var(--accent);outline:3px solid var(--accent-soft);outline-offset:0}
.field::placeholder{color:var(--text3)}
select.field{padding:0 8px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
.field.sm{height:28px;font-size:12.5px;border-radius:7px}
label.lbl{display:block;font-size:12px;font-weight:500;color:var(--text2);margin:0 0 5px}
.check{display:flex;gap:8px;align-items:center;color:var(--text2);font-size:12.5px}
.check input{accent-color:var(--accent);margin:0}
.link{color:var(--accent);cursor:pointer;font-size:12.5px}
.link:hover{text-decoration:underline}
.hint{font-size:12px;color:var(--text2);line-height:1.45}
.err{color:var(--danger);font-size:12.5px;line-height:1.4}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=checkbox].cb{width:15px;height:15px;accent-color:var(--accent);margin:0;flex:none}

/* ---------- app shell (Dropfin) ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;padding:14px 10px 10px}
.sb-head{display:flex;align-items:center;gap:10px;padding:2px 8px 10px}
.sb-head img{width:24px;height:24px}
.sb-title{font-weight:650;font-size:13px}
#sb-nav{flex:1;overflow:auto;padding-bottom:8px}
.sb-section{font-size:11px;font-weight:600;color:var(--text3);padding:14px 10px 4px}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 10px;border-radius:8px;text-align:left}
.sb-item .fx{color:var(--sb-neutral);width:18px}
.sb-item.t-purple .fx{color:var(--sb-movies)}
.sb-item.t-teal .fx{color:var(--sb-tv)}
.sb-item.t-rose .fx{color:var(--sb-music)}
.sb-item.t-amber .fx{color:var(--sb-books)}
.sb-item.t-green .fx{color:var(--sb-photos)}
.sb-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .cnt{flex:none;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.sb-item:hover{background:var(--hover)}
.sb-item.active{background:var(--sb-active)}
.sb-foot{border-top:1px solid var(--border);padding:12px 6px 0;display:grid;gap:12px}
.storage .lbl2{font-size:11px;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--text2);border-radius:3px;transition:width .25s linear}
.sb-conn{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:8px;width:100%;text-align:left}
.sb-conn:hover{background:var(--hover)}
.sb-conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sb-conn .dot.off{background:var(--warn)}
.sb-conn .dot.unk{background:var(--text3)}
.upd-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;opacity:.85}
.sb-conn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sb-conn .fx{color:var(--text2)}

.main{display:grid;grid-template-rows:52px minmax(0,1fr) 30px;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--border);min-width:0}
.tb{height:30px;min-width:32px;padding:0 7px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text2);flex:none}
.tb:hover:not(:disabled){background:var(--hover);color:var(--text)}
.tb:disabled{opacity:.35}
.tb.on{background:var(--sb-active);color:var(--text)}
.tb.label{padding:0 10px;font-weight:500}
.tb-title{font-size:14px;font-weight:650;margin:0 0 0 6px;padding:4px 8px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:40%}
.tb-spacer{flex:1;min-width:8px}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 5px;flex:none}
.seg{display:flex;background:var(--input);border-radius:8px;padding:2px;gap:2px;flex:none;margin-right:4px}
.seg button{height:26px;min-width:32px;padding:0 8px;border-radius:6px;display:grid;place-items:center;color:var(--text2);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);outline:1px solid var(--border-strong);outline-offset:-1px}
.seg.text button{padding:0 12px;font-weight:500;font-size:12.5px}
.search{display:flex;align-items:center;gap:6px;height:30px;background:var(--input);border-radius:8px;padding:0 9px;color:var(--text2);width:190px;margin-left:6px;flex:none}
.search input{border:0;background:none;flex:1;min-width:0;outline:none;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--text3)}

.content{position:relative;min-height:0;display:flex;flex-direction:column}
.files{flex:1;overflow:auto;padding:0 8px 16px;scroll-padding-top:34px}
.files:focus,.files:focus-visible{outline:none}
.list-head{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:var(--cols);border-bottom:1px solid var(--border);margin:0 -8px 4px;padding:0 8px}
.list-head button,.list-head div{text-align:left;padding:0 10px;font-size:11.5px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:4px;border-left:1px solid var(--border);margin:5px 0;height:18px;white-space:nowrap;overflow:hidden}
.list-head>:first-child{border-left:0}
.list-head .r{justify-content:flex-end}
.list-head button.sorted{color:var(--text);font-weight:600}
.list-head button:hover{color:var(--text)}
.row{display:grid;grid-template-columns:var(--cols);min-height:28px;align-items:center;border-radius:7px}
.row>div{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover{background:var(--hover)}
.row.tall{min-height:40px}
.c-name{display:flex;align-items:center;gap:8px;min-width:0}
.c-name .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-name .two{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.c-name .two small{color:var(--text2);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-dim{color:var(--text2)}
.c-r{text-align:right;font-variant-numeric:tabular-nums}
.row.sel{background:var(--sel);color:#fff}
.row.sel .c-dim,.row.sel small{color:rgba(255,255,255,.82)!important}
.files:not(:focus-within) .row.sel{background:var(--sel-inactive);color:var(--text)}
.files:not(:focus-within) .row.sel .c-dim,.files:not(:focus-within) .row.sel small{color:var(--text2)!important}
.row.off{opacity:.55}
.grp{font-size:11px;font-weight:600;color:var(--text3);padding:14px 10px 4px;display:flex;align-items:center;gap:8px}
.grp .r{margin-left:auto;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px;padding-top:6px}
.tile{display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;border-radius:10px;gap:5px;min-width:0;position:relative}
.tile:hover{background:var(--hover)}
.tile .ic{width:64px;height:64px;display:grid;place-items:center}
.tile .ic img{width:64px;height:64px}
.tile .nm{font-size:12px;text-align:center;line-height:1.3;padding:1px 6px;border-radius:5px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tile .sub{font-size:11px;color:var(--text3);margin-top:-3px}
.tile.sel{background:var(--sel-inactive)}
.tile.sel .nm{background:var(--sel);color:#fff}
.tile .bdg{position:absolute;top:6px;right:12px}
.empty{min-height:calc(100% - 40px);display:grid;place-items:center;text-align:center;color:var(--text2);padding:24px}
.empty .box{display:grid;gap:8px;justify-items:center;padding:30px 40px;border:1.5px dashed var(--border-strong);border-radius:18px;max-width:520px}
.empty .box b{color:var(--text);font-size:14px;font-weight:600}
.empty .box .big-ic{font-size:30px;color:var(--text3);margin-bottom:4px}
.loading{display:grid;place-items:center;height:60%;color:var(--text3);gap:10px;align-content:center;text-align:center}
.content.drop-here::after{content:"";position:absolute;inset:6px;border:2px solid var(--accent);border-radius:12px;background:var(--accent-soft);pointer-events:none;z-index:5}

.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text2);min-width:0}
.statusbar>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-right{flex:none}

/* app icons, badges */
.aic{width:20px;height:20px;flex:none;display:grid;place-items:center}
.aic img{width:20px;height:20px;display:block}
.aic.lg{width:28px;height:28px}.aic.lg img{width:28px;height:28px}
.aic .fx{color:var(--text3)}
.bdg{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:600;background:var(--input);color:var(--text2);white-space:nowrap;flex:none}
.bdg.blue{background:var(--accent-soft);color:var(--accent)}
.bdg.green{background:var(--ok-soft);color:var(--ok)}
.bdg.orange{background:var(--warn-soft);color:var(--warn)}
.bdg.red{background:var(--danger-soft);color:var(--danger)}
.bdg.purple{background:rgba(139,120,198,.16);color:var(--sb-movies)}
.row.sel .bdg{background:rgba(255,255,255,.2);color:#fff}
.files:not(:focus-within) .row.sel .bdg{background:var(--input);color:var(--text2)}
.bdgs{display:flex;gap:4px;flex:none}

/* detail header */
.detail{padding:18px 8px 0}
.hcard{display:flex;gap:16px;align-items:center;padding:4px 10px 18px;border-bottom:1px solid var(--border)}
.hcard .big{width:72px;height:72px;flex:none;display:grid;place-items:center}
.hcard .big img{width:72px;height:72px}
.hcard .big .fx{font-size:46px;color:var(--text3)}
.hcard .meta{flex:1;min-width:0}
.hcard h1{font-size:20px;margin:0 0 3px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .sub{color:var(--text2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:text;user-select:text}
.hcard .bdgs{margin-top:7px;flex-wrap:wrap}
.hcard .acts{display:flex;gap:8px;align-items:center;flex:none}
.banner{display:flex;gap:10px;align-items:center;margin:12px 10px 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--text);font-size:12.5px;line-height:1.4}
.banner .fx{color:var(--warn);font-size:15px}
.banner.info{background:var(--accent-soft)}
.banner.info .fx{color:var(--accent)}
.banner .grow{flex:1;min-width:0}
.subbar{display:flex;align-items:center;gap:10px;padding:10px 10px 6px;color:var(--text2);font-size:12px}
.subbar .grow{flex:1}

/* bottom action bar */
.actionbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border);background:var(--bg);flex:none}
.actionbar .info{flex:1;min-width:0;color:var(--text2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actionbar .info b{color:var(--text);font-weight:600}

/* chips (Developer environments, filters) */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 10px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--input);color:var(--text);font-weight:500;font-size:12px;white-space:nowrap}
.chip:hover{background:var(--input-hover)}
.chip.on{background:var(--accent);color:#fff}
.chip small{opacity:.75;font-weight:500}

/* panels / cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:16px 10px}
.card{border:1px solid var(--border);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;background:var(--panel)}
.card h4{margin:0;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h4 .fx{color:var(--accent);width:18px}
.card p{margin:0;color:var(--text2);font-size:12.5px;line-height:1.45}
.card .btn{justify-self:start;margin-top:4px}
.term{font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--ql);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 10px 12px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text;color:var(--text)}
.term:empty{display:none}

/* file search filter builder */
.fbuilder{padding:12px 10px 4px;display:grid;gap:8px;border-bottom:1px solid var(--border)}
.frow{display:flex;gap:6px;align-items:center}
.frow .field{width:auto}
.frow .grow{flex:1;min-width:80px}
.frow .x{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text2);flex:none}
.frow .x:hover{background:var(--hover);color:var(--text)}
.fopts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:2px 0 8px}

/* ---------- menus, dialogs, toasts (Dropfin) ---------- */
.menu{position:fixed;z-index:70;min-width:210px;max-width:320px;background:var(--panel);border:1px solid var(--border-strong);border-radius:11px;padding:5px;display:grid}
.mi{display:flex;justify-content:space-between;align-items:center;gap:24px;height:26px;padding:0 10px;border-radius:6px;text-align:left;white-space:nowrap}
.mi span{overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.mi:hover:not(:disabled),.mi.kb{background:var(--accent);color:#fff}
.mi:hover kbd,.mi.kb kbd{color:rgba(255,255,255,.8)}
.mi:disabled{color:var(--text3)}
.mi.danger{color:var(--danger)}
.mi.danger:hover{background:var(--danger);color:#fff}
.mi kbd{color:var(--text3);font-size:12px}
.mi .ck{width:12px;display:inline-block}
.mhead{font-size:11px;font-weight:600;color:var(--text3);padding:6px 10px 3px}
.sep{height:1px;background:var(--border);margin:4px 8px}
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:60;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--border-strong);border-radius:16px;width:min(400px,100%);padding:22px;max-height:calc(100vh - 32px);overflow:auto}
.dialog.wide{width:min(560px,100%)}
.dialog.xwide{width:min(720px,100%)}
.dialog h3{margin:0 0 6px;font-size:14px;font-weight:650}
.dialog p{margin:0 0 14px;color:var(--text2);line-height:1.45}
.dialog .field{margin-bottom:14px}
.dialog form{display:block}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.dlg-btns .left{margin-right:auto}
.dlg-icon{width:44px;height:44px;margin-bottom:12px;display:grid;place-items:center}
.dlg-icon img{width:44px;height:44px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;font-size:12.5px;margin:6px 0 18px}
.kv dt{color:var(--text2);text-align:right}
.kv dd{margin:0;word-break:break-all;-webkit-user-select:text;user-select:text}
.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--input);border-radius:8px;padding:8px 10px;word-break:break-all;-webkit-user-select:text;user-select:text;margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:80;font-weight:500;max-width:calc(100vw - 32px);text-align:center;display:flex;gap:12px;align-items:center}
.toast.bad{background:var(--danger);color:#fff}
.toast button{font-weight:650;text-decoration:underline}
.dlist{border:1px solid var(--border);border-radius:10px;max-height:300px;overflow:auto;margin:0 0 14px;padding:4px}
.dlist .row{grid-template-columns:auto minmax(0,1fr) auto;gap:0}
.notes{font-size:12.5px;line-height:1.5;color:var(--text2);max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 0 14px;-webkit-user-select:text;user-select:text}
.notes img{max-width:100%}

/* settings */
.set-tabs{margin:2px 0 16px}
.set-row{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border)}
.set-row:first-of-type{border-top:0}
.set-row .t{flex:1;min-width:0}
.set-row .t>b{display:block;font-weight:600;margin-bottom:2px}
.set-row code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--input);border-radius:5px;padding:1px 5px}
.set-row .t small{display:block;color:var(--text2);font-size:12px;line-height:1.45}
.toggle{position:relative;width:34px;height:20px;flex:none;margin-top:2px}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle i{position:absolute;inset:0;background:var(--track);border-radius:999px;transition:background .15s}
.toggle i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked+i{background:var(--accent)}
.toggle input:checked+i::after{transform:translateX(14px)}
.levels{display:grid;gap:8px;margin:4px 0 6px}
.level{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.level.on{border-color:var(--accent);background:var(--accent-soft)}
.level input{margin:2px 0 0;accent-color:var(--accent)}
.level b{display:block;margin-bottom:2px}
.level small{color:var(--text2);font-size:12px;line-height:1.45}
.plist{border:1px solid var(--border);border-radius:10px;padding:4px;margin:6px 0 8px;max-height:150px;overflow:auto}
.plist .it{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 10px;border-radius:7px}
.plist .it:hover{background:var(--hover)}
.plist .it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.plist .none{color:var(--text3);font-size:12px;padding:6px 10px}
.icon-btn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.addrow{display:flex;gap:6px}
.addrow .field{margin:0;height:30px}

/* console (bottom-right panel like Dropfin's transfers) */
.console{position:fixed;right:16px;bottom:44px;width:min(520px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--border-strong);border-radius:16px;z-index:50;display:flex;flex-direction:column;max-height:min(55vh,460px)}
.con-head{display:flex;align-items:center;gap:10px;padding:12px 10px 10px 14px;border-bottom:1px solid var(--border)}
.con-head .t{flex:1;font-weight:650}
.con-body{overflow:auto;padding:8px 14px 12px;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
.con-body .src{color:var(--text3)}

/* standalone app window */
.app-mode .sidebar{padding-top:0}
.app-mode .sb-head{height:46px;padding:0}
.app-mode .sb-head>*{display:none}
</style>
</head>
<body>

<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head"><img src="/icon.svg" alt=""><div class="sb-title">Deskmart</div></div>
    <nav id="sb-nav"></nav>
    <div class="sb-foot">
      <div class="storage" id="storage"></div>
      <button class="sb-conn" id="sb-conn" title="Deskmart options"><i class="dot unk" id="perm-dot"></i><span id="perm-name">Deskmart</span><i class="upd-dot" id="upd-dot" hidden title="Update available"></i><i class="fa-solid fa-ellipsis fx" style="font-size:14px" aria-hidden="true"></i></button>
    </div>
  </aside>
  <main class="main">
    <header class="toolbar" id="toolbar"></header>
    <div class="content" id="content"></div>
    <footer class="statusbar"><div id="status-left"></div><div class="status-right" id="status-right"></div></footer>
  </main>
</div>

<div class="console" id="console" hidden>
  <div class="con-head"><div class="t">Console</div><button class="icon-btn" id="con-clear" title="Clear"></button><button class="icon-btn" id="con-close" title="Close"></button></div>
  <div class="con-body" id="con-body"></div>
</div>
<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
const TOKEN = document.querySelector('meta[name="deskmart-token"]').content;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IS_APP = !!window.__DESKMART_APP__;
if (IS_APP) document.documentElement.classList.add('app-mode');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('deskmart.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('deskmart.' + k, JSON.stringify(v)); } catch {} },
};

/* ------------------------------------------------------------ icons (Font Awesome Free, bundled) */
const fa = (name, px, color) => `<i class="fa-solid fa-${name} fx" style="font-size:${px}px${color ? ';color:' + color : ''}" aria-hidden="true"></i>`;
const I = {
  back: fa('chevron-left', 14), fwd: fa('chevron-right', 14), list: fa('list', 13), grid: fa('table-cells-large', 13), search: fa('magnifying-glass', 12),
  sort: fa('arrow-down-wide-short', 13), refresh: fa('arrows-rotate', 13), x: fa('xmark', 13), dots: fa('ellipsis', 14), trash: fa('trash-can', 13),
  apps: fa('table-cells', 13), orphans: fa('file-circle-question', 14), dev: fa('hammer', 13), find: fa('magnifying-glass', 13), brew: fa('mug-hot', 13),
  lipo: fa('scissors', 13), pkg: fa('box-open', 13), plug: fa('puzzle-piece', 13), svc: fa('gears', 13), upd: fa('circle-down', 13),
  app: fa('cube', 15), folder: fa('folder', 14), file: fa('file', 13), lock: fa('lock', 10), link: fa('link', 10), warn: fa('triangle-exclamation', 15), info: fa('circle-info', 15),
  play: fa('play', 11), stop: fa('stop', 11), console: fa('terminal', 12), shield: fa('shield-halved', 15), clock: fa('clock-rotate-left', 13), plus: fa('plus', 12),
  check: fa('check', 11), gear: fa('gear', 13), filter: fa('filter', 12),
};
const PAGES = [
  { id: 'apps', title: 'Apps', icon: I.apps, tint: 'purple', group: 'Clean' },
  { id: 'orphans', title: 'Orphans', icon: I.orphans, tint: 'amber', group: 'Clean' },
  { id: 'development', title: 'Developer', icon: I.dev, tint: 'teal', group: 'Clean' },
  { id: 'fileSearch', title: 'File Search', icon: I.find, tint: '', group: 'Tools' },
  { id: 'lipo', title: 'Lipo', icon: I.lipo, tint: 'green', group: 'Tools' },
  { id: 'updater', title: 'Updater', icon: I.upd, tint: 'teal', group: 'Tools' },
  { id: 'homebrew', title: 'Homebrew', icon: I.brew, tint: 'rose', group: 'Manage' },
  { id: 'packages', title: 'Packages', icon: I.pkg, tint: 'amber', group: 'Manage' },
  { id: 'plugins', title: 'Plugins', icon: I.plug, tint: 'purple', group: 'Manage' },
  { id: 'services', title: 'Services', icon: I.svc, tint: '', group: 'Manage' },
];
const iconUrl = (p, px) => `/api/icon?t=${TOKEN}&size=${px}&path=${encodeURIComponent(p)}`;
/** Finder icon for a path, falling back to a Font Awesome glyph if macOS can't draw one. */
function pic(p, px, fallback, cls = 'aic') {
  const fb = fallback || I.file;
  return `<span class="${cls}" data-fb="${esc(fb)}"><img src="${iconUrl(p, px * 2)}" alt="" loading="lazy" draggable="false"></span>`;
}
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.parentElement && img.parentElement.dataset.fb != null) img.parentElement.innerHTML = img.parentElement.dataset.fb;
}, true);

/* ------------------------------------------------------------ formatting (Dropfin) */
function fmtSize(b) {
  if (b == null) return '--';
  if (b < 1000) return b + ' bytes';
  const u = ['KB', 'MB', 'GB', 'TB', 'PB']; let i = -1;
  do { b /= 1000; i++; } while (b >= 1000 && i < u.length - 1);
  return (b >= 100 ? Math.round(b) : b >= 10 ? b.toFixed(1) : b.toFixed(2)).toString().replace(/\.0+$|(\.\d*?)0+$/, '$1') + ' ' + u[i];
}
const timeFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
const dateFmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
function fmtDate(sec) {
  if (!sec) return '--';
  const d = new Date(sec * 1000), now = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  if (diff === 0) return 'Today at ' + timeFmt.format(d);
  if (diff === 1) return 'Yesterday at ' + timeFmt.format(d);
  return dateFmt.format(d);
}
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? '' : 's'}`;
const baseOf = (p) => p.slice(p.lastIndexOf('/') + 1) || '/';
const parentOf = (p) => { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); };
let HOME = '';
const tild = (p) => (HOME && (p === HOME || p.startsWith(HOME + '/')) ? '~' + p.slice(HOME.length) : p);
const appName = (p) => baseOf(p).replace(/\.app$/, '');

/* ------------------------------------------------------------ api */
class HttpError extends Error { constructor(m, status, data) { super(m); this.status = status; this.data = data || {}; } }
function qs(p) { const u = new URLSearchParams(); for (const [k, v] of Object.entries(p || {})) if (v != null) u.append(k, v); return u.toString(); }
async function api(method, p, params, body) {
  let r;
  try {
    r = await fetch('/api/' + p + (params ? '?' + qs(params) : ''), {
      method, headers: { 'X-Deskmart-Token': TOKEN, ...(method === 'POST' ? { 'Content-Type': 'application/json' } : {}) },
      body: method === 'POST' ? JSON.stringify(body || {}) : undefined,
    });
  } catch { throw new HttpError("Deskmart isn't running anymore. Open the app again.", 0, { reason: 'gone' }); }
  let data = null;
  try { data = await r.json(); } catch {}
  if (!r.ok) {
    if (data && data.reason === 'token') location.reload();
    throw new HttpError((data && data.error) || r.statusText || 'Something went wrong', r.status, data);
  }
  return data;
}
/** Polls a background task until it finishes. */
async function follow(taskId, { onItems, onLines, onProgress } = {}) {
  let items = 0, lines = 0;
  for (;;) {
    const t = await api('GET', 'task', { id: taskId, items, lines });
    items = t.itemCount; lines = t.lineCount;
    if (t.items.length && onItems) onItems(t.items);
    if (t.lines.length && onLines) onLines(t.lines);
    if (onProgress) onProgress(t.progress, t);
    if (t.status !== 'running') { if (t.status === 'error') throw new HttpError(t.error || 'Failed', 500); return t; }
    await sleep(350);
  }
}

/* ------------------------------------------------------------ state */
const S = {
  page: LS.get('page', 'apps'), st: null, settings: null, view: LS.get('view', 'list'), sort: LS.get('sort', { key: 'name', dir: 1 }),
  filter: '', apps: null, appsLoading: false, sel: new Set(), anchor: null, detail: null, nativeArch: 'arm', update: null,
  cache: {}, task: null,
};
const setStatus = (l, r) => { $('#status-left').textContent = l || ''; $('#status-right').textContent = r || ''; };

/* ------------------------------------------------------------ toast, menu, modal (Dropfin) */
let toastTimer;
function toast(msg, bad, action) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  if (action) t.querySelector('button').onclick = () => { t.hidden = true; action.run(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 5600 : action ? 7000 : 2800);
}
const showError = (e) => toast(e && e.message ? e.message : String(e), true);

const menuEl = $('#menu');
let menuItems = [];
function showMenu(items, x, y, anchorEl) {
  items = items.filter(Boolean).filter((it, i, a) => !(it === '-' && (i === 0 || a[i - 1] === '-' || i === a.length - 1)));
  if (items[items.length - 1] === '-') items.pop();
  menuItems = items;
  menuEl.innerHTML = items.map((it, i) => it === '-' ? '<div class="sep"></div>' : it.head ? `<div class="mhead">${esc(it.head)}</div>` :
    `<button class="mi${it.danger ? ' danger' : ''}" data-i="${i}" ${it.disabled ? 'disabled' : ''}><span>${it.checked != null ? `<i class="ck">${it.checked ? '✓' : ''}</i>` : ''}${esc(it.label)}</span>${it.kbd ? `<kbd>${esc(it.kbd)}</kbd>` : ''}</button>`).join('');
  menuEl.hidden = false;
  const r = menuEl.getBoundingClientRect();
  if (anchorEl) { const a = anchorEl.getBoundingClientRect(); x = Math.min(a.left, innerWidth - r.width - 8); y = a.bottom + 4; if (y + r.height > innerHeight - 8) y = a.top - r.height - 4; }
  menuEl.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
  menuEl.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + 'px';
}
function hideMenu() { menuEl.hidden = true; }
menuEl.addEventListener('click', (e) => { const b = e.target.closest('.mi'); if (!b || b.disabled) return; hideMenu(); const it = menuItems[+b.dataset.i]; it && it.action && it.action(); });
document.addEventListener('mousedown', (e) => { if (!menuEl.hidden && !menuEl.contains(e.target)) hideMenu(); }, true);
window.addEventListener('blur', hideMenu);
window.addEventListener('resize', hideMenu);

let modalOpen = 0;
function modal({ title, message, html, input, inputValue = '', placeholder = '', check, checked = false, buttons, wide, icon, onOpen }) {
  return new Promise((resolve) => {
    modalOpen++; hideMenu();
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    buttons = buttons || [{ label: 'Cancel', value: null }, { label: 'OK', value: true, primary: true }];
    scrim.innerHTML = `<form class="dialog${wide === 'x' ? ' xwide' : wide ? ' wide' : ''}" novalidate>
      ${icon ? `<div class="dlg-icon">${icon}</div>` : ''}
      ${title ? `<h3>${esc(title)}</h3>` : ''}
      ${message ? `<p>${esc(message)}</p>` : ''}
      ${html || ''}
      ${input ? `<input class="field" name="v" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder)}" value="${esc(inputValue)}">` : ''}
      ${check ? `<label class="check" style="margin:-2px 0 16px"><input type="checkbox" name="c" ${checked ? 'checked' : ''}> ${esc(check)}</label>` : ''}
      <div class="dlg-btns">${buttons.map((b, i) => `<button type="${b.primary ? 'submit' : 'button'}" class="btn${b.primary ? ' primary' : ''}${b.danger ? ' danger' : ''}${b.left ? ' left' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>
    </form>`;
    document.body.appendChild(scrim);
    const form = scrim.firstElementChild;
    const inp = form.querySelector('input[name=v]');
    const finish = (val) => {
      if (!scrim.isConnected) return;
      scrim.remove(); modalOpen--; document.removeEventListener('keydown', onKey, true);
      resolve(val === null || val === undefined ? null : { value: val, input: inp ? inp.value : undefined, checked: form.c ? form.c.checked : undefined, form });
    };
    const primary = buttons.find((b) => b.primary);
    form.addEventListener('submit', (e) => { e.preventDefault(); if (primary) { if (primary.validate && !primary.validate(form)) return; finish(primary.value); } });
    form.addEventListener('click', (e) => { const b = e.target.closest('.dlg-btns button'); if (b && b.type === 'button') finish(buttons[+b.dataset.i].value); });
    scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) finish(null); });
    const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(null); } };
    document.addEventListener('keydown', onKey, true);
    if (onOpen) onOpen(form, finish);
    requestAnimationFrame(() => { if (inp) { inp.focus(); inp.select(); } else { const f = form.querySelector('.btn.primary'); f && f.focus(); } });
  });
}
const confirmDlg = (title, message, label = 'OK', danger = false, icon) =>
  modal({ title, message, icon, buttons: [{ label: 'Cancel', value: null }, { label, value: true, primary: true, danger }] });
const okDlg = (title, message, icon) => modal({ title, message, icon, buttons: [{ label: 'OK', value: true, primary: true }] });

/* ------------------------------------------------------------ shell: sidebar, toolbar */
function visiblePages() { const hidden = (S.settings && S.settings.hiddenPages) || []; return PAGES.filter((p) => !hidden.includes(p.id)); }
function renderSidebar() {
  let h = '', group = '';
  for (const p of visiblePages()) {
    if (p.group !== group) { group = p.group; h += `<div class="sb-section">${esc(group)}</div>`; }
    const cnt = p.id === 'apps' && S.apps ? S.apps.length : p.id === 'updater' && S.cache.updates ? (S.cache.updates.length || '') : '';
    h += `<button class="sb-item t-${p.tint} ${S.page === p.id ? 'active' : ''}" data-page="${p.id}">${p.icon}<span>${esc(p.title)}</span>${cnt !== '' ? `<i class="cnt">${cnt}</i>` : ''}</button>`;
  }
  $('#sb-nav').innerHTML = h;
  renderStorage();
}
function renderStorage() {
  const st = S.st; const el = $('#storage');
  if (!st || !st.total) { el.innerHTML = ''; return; }
  const used = 1 - st.free / st.total;
  el.innerHTML = `<div class="lbl2"><span>${fmtSize(st.free)} available</span><span>${fmtSize(st.total)}</span></div><div class="bar"><i style="width:${(used * 100).toFixed(1)}%;${used > 0.92 ? 'background:var(--danger)' : ''}"></i></div>`;
}
function renderPermDot() {
  const st = S.st; if (!st) return;
  const dot = $('#perm-dot'), name = $('#perm-name');
  const os = st.macosName ? `macOS ${st.macosName}` : st.macos ? `macOS ${st.macos}` : 'Deskmart';
  dot.className = 'dot' + (st.fullDiskAccess === true ? '' : st.fullDiskAccess === false ? ' off' : ' unk');
  name.textContent = os;
  $('#sb-conn').title = st.fullDiskAccess === false ? 'Full Disk Access is off — click for options' : 'Deskmart options';
}
$('#sb-nav').addEventListener('click', (e) => { const b = e.target.closest('.sb-item'); if (b) go(b.dataset.page); });
$('#sb-conn').onclick = (e) => {
  showMenu([
    { label: 'Settings…', kbd: '⌘,', action: () => settingsDlg() },
    { label: S.st && S.st.fullDiskAccess === false ? 'Permissions… (Full Disk Access is off)' : 'Permissions…', action: () => permissionsDlg() },
    { label: 'Restore Deleted Files…', action: () => historyDlg() },
    { label: 'Show Console', action: () => toggleConsole(true) },
    '-',
    S.update && S.update.available ? { label: 'Update Available…', action: () => updateDlg() } : { label: 'Check for Updates…', action: () => checkSelfUpdate(true) },
    { label: 'About Deskmart', action: () => settingsDlg('about') },
    IS_APP ? '-' : null,
    IS_APP ? { label: 'Quit Deskmart', action: () => api('POST', 'quit') } : null,
  ], 0, 0, e.currentTarget);
};

/** Builds the toolbar: [back] title … actions [search]. */
function toolbar({ back, title, actions = '', search = true, placeholder = 'Search' }) {
  $('#toolbar').innerHTML = `
    ${back ? `<button class="tb" id="tb-back" title="Back">${I.back}</button>` : ''}
    <div class="tb-title" id="tb-title">${esc(title)}</div>
    <div class="tb-spacer"></div>
    ${actions}
    ${search ? `<label class="search"><span>${I.search}</span><input id="search" type="search" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false" value="${esc(S.filter)}"></label>` : ''}`;
  if (back) $('#tb-back').onclick = back;
  const s = $('#search');
  if (s) s.oninput = () => { S.filter = s.value; rerender(); };
}
const content = () => $('#content');
let rerender = () => {};

function go(page, opts = {}) {
  if (!PAGES.some((p) => p.id === page)) page = 'apps';
  if (S.page !== page) { S.filter = ''; S.sel.clear(); }
  S.page = page; LS.set('page', page);
  if (!opts.keepDetail) S.detail = null;
  renderSidebar();
  const fn = { apps: pageApps, orphans: pageOrphans, development: pageDev, fileSearch: pageSearch, lipo: pageLipo, updater: pageUpdater,
    homebrew: pageBrew, packages: pagePackages, plugins: pagePlugins, services: pageServices }[page];
  content().onscroll = null;
  fn();
}

/* ------------------------------------------------------------ shared list helpers */
function emptyBox(icon, title, text, button) {
  return `<div class="empty"><div class="box"><div class="big-ic">${icon}</div><b>${esc(title)}</b><div class="hint">${text || ''}</div>${button || ''}</div></div>`;
}
const loadingBox = (text) => `<div class="loading"><span class="spin"></span><div>${esc(text || 'Loading…')}</div></div>`;
const matches = (q, ...fields) => !q || fields.some((f) => f && String(f).toLowerCase().includes(q.toLowerCase()));
/** Shown when macOS's privacy protection hid folders from a search — but only while Full Disk Access is off,
 *  since granting it is the fix. `fda` is the status the search itself saw. */
function deniedBanner(denied, fda) {
  if (!denied || !denied.length) return '';
  if (fda === true) { if (S.st && !S.st.fullDiskAccess) { S.st.fullDiskAccess = true; renderPermDot(); } return ''; }
  const os = S.st && S.st.macosMajor >= 27 ? 'macOS 27 keeps other apps’ data private unless Deskmart has Full Disk Access.' : 'Deskmart needs Full Disk Access to look there.';
  return `<div class="banner">${I.warn}<div class="grow">macOS didn't let Deskmart look in ${plural(denied.length, 'folder')}, so some files may be missing. ${esc(os)} If you just turned it on, quit and reopen Deskmart.
    <details style="margin-top:4px"><summary class="link" style="font-size:12px">Show ${denied.length === 1 ? 'folder' : 'folders'}</summary><div style="margin-top:4px;font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text">${denied.map((d) => esc(tild(d))).join('<br>')}</div></details></div>
    <button class="btn sm" data-act="perm">Permissions…</button></div>`;
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-act="perm"]'); if (b) permissionsDlg(); });

/** Checkbox list of paths with sizes. state: {items:[{path,size,...}], checked:Set} */
function fileRows(items, checked, opts = {}) {
  return items.map((f, i) => {
    const isApp = f.path.endsWith('.app');
    const fb = f.dir ? (isApp ? I.app : fa('folder', 14, 'var(--folder)')) : I.file;

    return `<div class="row${checked.has(f.path) ? '' : ' off'}" data-i="${i}" data-path="${esc(f.path)}">

/** Wires checkbox toggles, ⇧-click ranges, and the context menu for a fileRows list. */
function wireFileRows(root, getItems, checked, onChange, ctx) {
  let last = null;
  root.onclick = (e) => {
    const row = e.target.closest('.row[data-path]'); if (!row) return;
    const items = getItems(); const i = +row.dataset.i; const p = row.dataset.path;
    if (e.shiftKey && last != null) {
      const [a, b] = [Math.min(last, i), Math.max(last, i)]; const on = !checked.has(p);
      for (let k = a; k <= b; k++) on ? checked.add(items[k].path) : checked.delete(items[k].path);
    } else checked.has(p) ? checked.delete(p) : checked.add(p);
    last = i; onChange();
  };
  root.oncontextmenu = (e) => {
    const row = e.target.closest('.row[data-path]'); if (!row) return;
    e.preventDefault();
    const p = row.dataset.path;
    showMenu([
      { label: 'Show in Finder', action: () => api('POST', 'reveal', null, { path: p }) },
      { label: 'Copy Path', action: () => copy(p) },
      ...(ctx ? ctx(p, getItems()[+row.dataset.i]) : []),
    ], e.clientX, e.clientY);
  };
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied'); } catch { await modal({ title: 'Path', html: `<div class="mono">${esc(text)}</div>`, buttons: [{ label: 'OK', value: true, primary: true }] }); } }

/** Moves paths to the Trash, with optional confirmation, then offers Undo. */
async function trashPaths(paths, name, extra = {}) {
  if (!paths.length) return null;
  if (S.settings.confirmDelete && !extra.noConfirm) {
    const r = await confirmDlg(extra.title || `Move ${plural(paths.length, 'item')} to the Trash?`, extra.message || 'You can put them back from Restore Deleted Files, or from the Trash.', 'Move to Trash', true);
    if (!r) return null;
  }
  let res;
  try { res = await api('POST', 'trash', null, { paths, name, ...extra.body }); }
  catch (e) {
    if (e.data && e.data.reason === 'running') {
      const q = await confirmDlg(e.message, 'Deskmart can quit it for you, then continue.', 'Quit and Continue');
      if (!q) return null;
      res = await api('POST', 'trash', null, { paths, name, ...extra.body, quit: true });
    } else throw e;
  }
  if (res.failed.length) {
    const first = res.failed[0];
    if (res.moved) toast(`Moved ${plural(res.moved, 'item')}; ${res.failed.length} couldn't be moved: ${first.error}`, true);
    else toast(`Couldn't move ${baseOf(first.path)}: ${first.error}`, true);
  } else if (res.moved) {
    toast(`Moved ${plural(res.moved, 'item')} to the Trash${res.size ? ' (' + fmtSize(res.size) + ')' : ''}`, false, res.record ? { label: 'Undo', run: () => restore([res.record]) } : null);
  }
  if (res.brew) setTimeout(() => toast(res.brew), 3000);
  refreshDisk();
  return res;
}
async function restore(ids) {
  try {
    const r = await api('POST', 'history/restore', null, { ids });
    toast(r.failed.length ? `Put back ${plural(r.restored, 'item')}; ${r.failed.length} couldn't be: ${r.failed[0].error}` : `Put back ${plural(r.restored, 'item')}`, !!r.failed.length);
    S.apps = null; S.cache = {}; go(S.page);
  } catch (e) { showError(e); }
}
async function refreshDisk() { try { const st = await api('GET', 'state'); S.st = st; S.settings = st.settings; renderStorage(); renderPermDot(); } catch {} }

/* ============================================================ APPS */
function sortApps(list) {
  const { key, dir } = S.sort;
  const v = (a) => key === 'size' ? a.size : key === 'created' ? a.created || 0 : key === 'added' ? a.added || 0 : key === 'modified' ? a.modified || 0 : key === 'lastUsed' ? a.lastUsed || 0 : null;
  return list.slice().sort((a, b) => {
    if (key === 'name') return dir * a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true });
    return dir * (v(a) - v(b)) || a.name.localeCompare(b.name);
  });
}
const SORTS = [['name', 'App Name'], ['size', 'App Size'], ['created', 'Date Created'], ['added', 'Date Added'], ['modified', 'Modified Date'], ['lastUsed', 'Last Used Date']];
function appBadges(a, full) {
  if (!S.settings.showBadges && !full) return '';
  const b = [];
  if (a.wrapped) b.push('<i class="bdg blue" title="iPhone or iPad app">iOS</i>');
  if (a.webApp) b.push('<i class="bdg blue" title="Web app">Web</i>');
  if (a.steam) b.push('<i class="bdg purple">Steam</i>');
  if (a.cask) b.push(`<i class="bdg orange" title="Installed with Homebrew (${esc(a.cask)})">brew</i>`);
  if (full && a.appStore) b.push('<i class="bdg blue">App Store</i>');
  if (full && a.sparkle) b.push('<i class="bdg">Sparkle</i>');
  if (a.arch === 'intel' && S.nativeArch === 'arm') b.push(`<i class="bdg red" title="${S.st && S.st.macosMajor >= 27 ? 'Intel-only: needs Rosetta, which macOS 27 is phasing out' : 'Intel-only: runs through Rosetta'}">Intel</i>`);
  if (full && a.arch === 'universal') b.push('<i class="bdg green">Universal</i>');
  if (full && a.arch === 'arm') b.push('<i class="bdg">Apple silicon</i>');
  return b.join('');
}

async function bulkUninstall() {
  const apps = S.apps.filter((a) => S.sel.has(a.path));
  const c = await confirmDlg(`Uninstall ${plural(apps.length, 'app')}?`, `${apps.map((a) => a.name).join(', ')} and the files Deskmart finds for each will be moved to the Trash. Open apps are quit first.`, 'Uninstall', true);
  if (!c) return;
  let moved = 0, failed = 0;
  for (const [i, a] of apps.entries()) {
    setStatus(`Uninstalling ${a.name} (${i + 1} of ${apps.length})…`);
    try {
      const r = await api('POST', 'app/files', null, { path: a.path });
      const res = await api('POST', 'trash', null, { paths: r.files.map((f) => f.path), name: a.name, app: a.container || a.path, quit: true });
      moved += res.moved; failed += res.failed.length;
    } catch (e) { failed++; }
  }
  toast(failed ? `Moved ${plural(moved, 'item')} to the Trash; ${failed} couldn't be moved` : `Uninstalled ${plural(apps.length, 'app')} (${plural(moved, 'item')} moved to the Trash)`, failed > 0);
  S.sel.clear(); await loadApps(false); refreshDisk(); pageApps();
}

/* ============================================================ ORPHANS */
function pageOrphans() {
  const st = S.cache.orphans || (S.cache.orphans = { items: null, checked: new Set(), denied: [], running: false, progress: null });
  toolbar({ title: 'Orphaned Files', placeholder: 'Filter',
    actions: `<button class="tb label" id="tb-scan">${st.running ? I.stop + ' Stop' : I.refresh + (st.items ? ' Scan Again' : ' Scan')}</button>` });
  $('#tb-scan').onclick = () => st.running ? api('POST', 'task/stop', null, { id: st.task }) : scan();
  const c = content();
  const visible = () => (st.items || []).filter((f) => matches(S.filter, f.path));
  const render = () => {
    if (S.page !== 'orphans') return;
    if (st.running && !st.items) {
      const p = st.progress || {};
      c.innerHTML = loadingBox(p.step ? `Scanning ${p.step}${p.found != null ? ` · ${p.found} found` : ''}` : 'Scanning…');
      setStatus('Scanning Library folders…'); return;
    }
    if (!st.items) {
      c.innerHTML = emptyBox(I.orphans, 'Orphaned Files', 'Find files and folders left behind by apps you already deleted. Deskmart compares Library folders against your installed apps.', '<button class="btn primary" id="eb-scan" style="margin-top:6px">Scan</button>');
      $('#eb-scan').onclick = scan; setStatus(''); return;
    }
    const items = visible();
    const sel = st.items.filter((f) => st.checked.has(f.path));
    const total = st.items.reduce((n, f) => n + f.size, 0);
    c.innerHTML = `<section class="files" tabindex="0" style="--cols:30px minmax(240px,1fr) auto 90px">
      <div class="banner info" style="margin-top:12px">${I.info}<div class="grow">This is a best guess: Deskmart can't see apps that are already gone, so it hides anything that matches an installed app. Check that what you select really belongs to deleted apps.</div></div>
      ${deniedBanner(st.denied, st.fda)}
      <div class="subbar"><label class="check"><input type="checkbox" class="cb" id="o-all" ${sel.length && sel.length === st.items.length ? 'checked' : ''}> Select All</label><span class="grow"></span><span>${plural(st.items.length, 'item')} · ${fmtSize(total)}</span></div>
      <div id="o-rows">${items.length ? fileRows(items, st.checked) : `<div class="hint" style="padding:16px 10px">${st.items.length ? 'Nothing matches the filter.' : 'No orphaned files found. Nice and tidy.'}</div>`}</div></section>
      <div class="actionbar"><div class="info"><b>${plural(sel.length, 'item')}</b> selected · ${fmtSize(sel.reduce((n, f) => n + f.size, 0))}</div>
        <button class="btn" id="o-link" ${sel.length ? '' : 'disabled'} title="Link the selected files to an installed app, so they're removed with it and not listed here">Link to App…</button>
        <button class="btn" id="o-ex" ${sel.length ? '' : 'disabled'}>Exclude</button>
        <button class="btn danger" id="o-del" ${sel.length ? '' : 'disabled'}>Move to Trash</button></div>`;
    setStatus(`${plural(st.items.length, 'orphaned item')}`, fmtSize(total));
    $('#o-all').onchange = (e) => { if (e.target.checked) st.items.forEach((f) => st.checked.add(f.path)); else st.checked.clear(); render(); };
    wireFileRows($('#o-rows'), visible, st.checked, render);
    $('#o-del').onclick = async () => {
      const paths = sel.map((f) => f.path);
      const r = await trashPaths(paths, 'Orphaned Files').catch(showError);
      if (r && r.moved) { const gone = new Set(paths.filter((p) => !r.failed.some((f) => f.path === p))); st.items = st.items.filter((f) => !gone.has(f.path)); gone.forEach((p) => st.checked.delete(p)); render(); }
    };
    $('#o-ex').onclick = async () => {
      const paths = sel.map((f) => f.path);
      const r = await api('POST', 'exclude', null, { list: 'orphans', paths }); S.settings = r.settings;
      st.items = st.items.filter((f) => !paths.includes(f.path)); paths.forEach((p) => st.checked.delete(p)); render();
      toast(`Excluded ${plural(paths.length, 'item')}. Edit the list in Settings → Folders.`);
    };
    $('#o-link').onclick = async () => {
      if (!S.apps) await loadApps(false);
      const opts = sortApps(S.apps).map((a) => `<option value="${esc(a.container || a.path)}">${esc(a.name)}</option>`).join('');
      const r = await modal({ title: 'Link to an app', message: `When you uninstall the app you choose, Deskmart includes these ${plural(sel.length, 'item')}. They also stop showing up here.`, html: `<select class="field" name="app">${opts}</select>`,
        buttons: [{ label: 'Cancel', value: null }, { label: 'Link', value: true, primary: true }] });
      if (!r) return;
      const paths = sel.map((f) => f.path);
      await api('POST', 'link', null, { app: r.form.app.value, paths });
      st.items = st.items.filter((f) => !paths.includes(f.path)); paths.forEach((p) => st.checked.delete(p)); render();
      toast(`Linked to ${appName(r.form.app.value)}`);
    };
  };
  async function scan() {
    if (!S.settings.orphanWarningSeen) {
      const ok = await modal({ title: 'Before you scan', message: "Orphaned file search isn't 100% accurate: it has no uninstalled app bundles to compare against, so it makes a best guess and hides anything that matches the apps you have now. Please confirm the files you remove really belong to apps you deleted.", buttons: [{ label: 'Cancel', value: null }, { label: 'I Understand', value: true, primary: true }] });
      if (!ok) return;
      const r = await api('POST', 'settings', null, { orphanWarningSeen: true }); S.settings = r.settings;
    }
    st.running = true; st.items = null; st.checked.clear(); st.progress = null; pageOrphans();
    try {
      const { task } = await api('POST', 'orphans/start'); st.task = task;
      const t = await follow(task, { onProgress: (p) => { st.progress = p; render(); } });
      st.items = (t.result && t.result.items) || []; st.denied = (t.result && t.result.denied) || []; st.fda = t.result && t.result.fullDiskAccess;
      st.items.sort((x, y) => y.size - x.size);
    } catch (e) { showError(e); st.items = st.items || null; }
    st.running = false;
    if (S.page === 'orphans') pageOrphans();
  }
  rerender = render; render();
}

      <div class="grp" style="margin-top:14px">Workspace Storage Cleaner<span class="r"></span></div>

      <div style="padding:0 10px 10px"><button class="btn sm" id="ws-scan">${st.ws ? 'Scan Again' : 'Find Orphaned Workspaces'}</button></div>
      <div id="ws-rows">${st.ws ? (st.ws.length ? st.ws.map((w) => `<div class="row" style="grid-template-columns:minmax(0,1fr) 90px auto"><div class="c-name">${fa('folder-open', 13, 'var(--text3)')}<div class="two"><span class="nm">${esc(tild(w.project))}</span><small>${esc(w.editor)} · ${esc(baseOf(w.path))}</small></div></div><div class="c-r c-dim">${fmtSize(w.size)}</div><div><button class="btn sm" data-ws="${esc(w.path)}">Delete</button></div></div>`).join('') + `<div style="padding:8px 10px"><button class="btn sm danger" id="ws-all">Delete All (${fmtSize(st.ws.reduce((n, w) => n + w.size, 0))})</button></div>` : '<div class="hint" style="padding:0 10px">No orphaned workspaces found.</div>') : ''}</div>
    </section>
    <div class="actionbar"><div class="info"><b>${plural(sel.length, 'folder')}</b> selected · ${fmtSize(sum(sel))}</div>
      <button class="btn" id="v-contents" ${sel.length ? '' : 'disabled'} title="Empty the folders but keep them">Delete Contents</button>
      <button class="btn danger" id="v-folders" ${sel.length ? '' : 'disabled'}>Delete Folders</button></div>`;
    setStatus(`${plural(all().length, 'cache folder')} found`, fmtSize(sum(all())));

    if ($('#v-rows')) wireFileRows($('#v-rows'), () => visible().sort((x, y) => y.size - x.size), st.checked, render);

    $('#v-folders').onclick = async () => { const r = await trashPaths(sel.map((p) => p.path), 'Developer Caches').catch(showError); if (r) done(); };
    $('#v-contents').onclick = async () => {
      const { paths } = await api('POST', 'dev/contents', null, { paths: sel.map((p) => p.path) });
      if (!paths.length) return toast('Those folders are already empty');
      const r = await trashPaths(paths, 'Developer Caches', { title: `Empty ${plural(sel.length, 'folder')}?`, message: `${plural(paths.length, 'item')} inside them will be moved to the Trash. The folders stay.` }).catch(showError);
      if (r) done();

/* ============================================================ FILE SEARCH */
const FILTER_TYPES = {

  extension: { label: 'Extension', ops: [['is', 'is'], ['isNot', 'is not']] },
  size: { label: 'Size', ops: [['greaterThan', 'is larger than'], ['lessThan', 'is smaller than'], ['between', 'is between']] },
  date: { label: 'Date', ops: [['modifiedAfter', 'modified after'], ['modifiedBefore', 'modified before'], ['modifiedBetween', 'modified between'], ['createdAfter', 'created after'], ['createdBefore', 'created before'], ['createdBetween', 'created between']] },
  kind: { label: 'Kind', ops: [['is', 'is']] },
  tags: { label: 'Tags', ops: [['contains', 'include'], ['doesntContain', "don't include"]] },
  comment: { label: 'Comment', ops: [['contains', 'contains'], ['doesntContain', "doesn't contain"]] },

const KINDS = [['file', 'File'], ['folder', 'Folder'], ['app', 'Application'], ['image', 'Image'], ['video', 'Movie'], ['audio', 'Music'], ['document', 'Document'], ['archive', 'Archive']];
function pageSearch() {
  const st = S.cache.search || (S.cache.search = { filters: [{ type: 'name', op: 'contains', value: '' }], root: 'home', custom: '', hidden: false, packages: false, results: null, checked: new Set(), running: false, sort: { k: 'size', d: -1 } });

  const c = content();
  const unit = (v) => { const u = [['GB', 1e9], ['MB', 1e6], ['KB', 1e3]].find(([, m]) => v >= m && v % m === 0) || ['MB', 1e6]; return u; };
  const dstr = (s) => s ? new Date(s * 1000).toISOString().slice(0, 10) : '';
  const filterRow = (f, i) => {
    const t = FILTER_TYPES[f.type];
    let val = '';
    if (f.type === 'size') {
      const [u, m] = unit(f.value || 1e6); const mk = (n, v) => `<input class="field sm" type="number" min="0" step="any" name="${n}" value="${v ? v / m : ''}" style="width:90px">`;
      val = `${mk('value', f.value)}${f.op === 'between' ? ' and ' + mk('max', f.max) : ''}<select class="field sm" name="unit">${['KB', 'MB', 'GB'].map((x) => `<option ${x === u ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
    } else if (f.type === 'date') {
      val = `<input class="field sm" type="date" name="value" value="${dstr(f.value)}">${f.op.endsWith('Between') ? ` and <input class="field sm" type="date" name="max" value="${dstr(f.max)}">` : ''}`;
    } else if (f.type === 'kind') {
      val = `<select class="field sm grow" name="value">${KINDS.map(([k, l]) => `<option value="${k}" ${f.value === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    } else {
      val = `<input class="field sm grow" name="value" value="${esc(f.value || '')}" placeholder="${f.type === 'extension' ? 'mp4, mov' : f.type === 'tags' ? 'Red, Work' : ''}" spellcheck="false">`;
    }
    return `<div class="frow" data-i="${i}"><select class="field sm" name="type">${Object.entries(FILTER_TYPES).map(([k, v]) => `<option value="${k}" ${k === f.type ? 'selected' : ''}>${v.label}</option>`).join('')}</select>
      <select class="field sm" name="op">${t.ops.map(([k, l]) => `<option value="${k}" ${k === f.op ? 'selected' : ''}>${l}</option>`).join('')}</select>${val}
      <button class="x" data-rm="${i}" title="Remove filter">${I.x}</button></div>`;
  };
  const readFilters = () => {
    $$('.frow', c).forEach((row) => {
      const f = st.filters[+row.dataset.i]; if (!f) return;
      const g = (n) => row.querySelector(`[name=${n}]`);
      f.op = g('op').value;
      if (f.type === 'size') { const m = { KB: 1e3, MB: 1e6, GB: 1e9 }[g('unit').value]; f.value = Math.round(parseFloat(g('value').value || 0) * m); f.max = g('max') ? Math.round(parseFloat(g('max').value || 0) * m) : null; }
      else if (f.type === 'date') { const d = (el) => el && el.value ? Math.floor(new Date(el.value + 'T00:00:00').getTime() / 1000) : 0; f.value = d(g('value')); f.max = g('max') ? d(g('max')) + 86399 : null; }
      else f.value = g('value').value;
    });
    st.root = $('#fs-root').value; st.custom = ($('#fs-custom') || {}).value || st.custom; st.hidden = $('#fs-hidden').checked; st.packages = $('#fs-pkg').checked;
  };

  };
  const render = () => {

    c.innerHTML = `<div class="fbuilder">${st.filters.map(filterRow).join('')}
      <div class="fopts"><button class="btn sm" id="fs-add">${I.plus} Add Filter</button>
        <span class="c-dim">in</span><select class="field sm" id="fs-root" style="width:auto"><option value="home" ${st.root === 'home' ? 'selected' : ''}>Home folder</option><option value="/" ${st.root === '/' ? 'selected' : ''}>Startup Disk</option><option value="/Applications" ${st.root === '/Applications' ? 'selected' : ''}>Applications</option><option value="custom" ${st.root === 'custom' ? 'selected' : ''}>Folder…</option></select>
        ${st.root === 'custom' ? `<input class="field sm" id="fs-custom" placeholder="/path/to/folder" value="${esc(st.custom)}" style="width:220px" spellcheck="false">` : ''}
        <label class="check"><input type="checkbox" id="fs-hidden" ${st.hidden ? 'checked' : ''}> Hidden files</label>

      <section class="files" tabindex="0" id="fs-files" style="--cols:30px minmax(220px,1fr) 110px 90px 150px">
        ${st.results == null ? (st.running ? loadingBox('Searching…') : emptyBox(I.find, 'Ready to search', 'Add filters, then click Search.')) : !res.length ? (st.running ? loadingBox('Searching…') : emptyBox(I.find, 'No results', 'Try adjusting your filters.')) :
        `<div class="list-head"><div></div>${hd('name', 'Name')}${hd('kind', 'Kind')}${hd('size', 'Size', 1)}${hd('modified', 'Modified')}</div>` +
        res.slice(0, 3000).map((r, i) => `<div class="row${st.checked.has(r.path) ? ' sel' : ''}" data-i="${i}" data-path="${esc(r.path)}"><div style="padding-right:0"><input type="checkbox" class="cb" ${st.checked.has(r.path) ? 'checked' : ''}></div>
          <div class="c-name">${pic(r.path, 20, r.dir ? fa('folder', 14, 'var(--folder)') : I.file)}<div class="two"><span class="nm">${esc(r.name)}</span><small>${esc(tild(parentOf(r.path)))}</small></div></div>
          <div class="c-dim">${esc(r.kind)}</div><div class="c-r c-dim">${r.dir ? (r.size ? fmtSize(r.size) : '--') : fmtSize(r.size)}</div><div class="c-dim">${fmtDate(r.modified)}</div></div>`).join('') + (res.length > 3000 ? `<div class="hint" style="padding:10px">Showing the first 3,000 of ${res.length.toLocaleString()} results.</div>` : '')}
      </section>
      ${sel.length ? `<div class="actionbar"><div class="info"><b>${plural(sel.length, 'item')}</b> selected · ${fmtSize(sel.reduce((n, r) => n + r.size, 0))}</div>${sel.length === 1 ? '<button class="btn" id="fs-ren">Rename…</button>' : ''}<button class="btn" id="fs-show">Show in Finder</button><button class="btn danger" id="fs-del">Move to Trash</button></div>` : ''}`;
    const p = st.progress || {};
    setStatus(st.results ? `${plural(st.results.length, 'result')}${p.scanned ? ` · ${p.scanned.toLocaleString()} items checked` : ''}` : '', p.ms ? `Elapsed ${(p.ms / 1000).toFixed(1)} s` : '');
    $$('.frow select[name=type]', c).forEach((s) => s.onchange = () => { readFilters(); const i = +s.closest('.frow').dataset.i; const t = s.value; st.filters[i] = { type: t, op: FILTER_TYPES[t].ops[0][0], value: t === 'kind' ? 'file' : t === 'size' ? 100e6 : t === 'date' ? Math.floor(Date.now() / 1000) - 30 * 86400 : '' }; render(); });
    $$('.frow select[name=op]', c).forEach((s) => s.onchange = () => { readFilters(); render(); });
    $$('[data-rm]', c).forEach((b) => b.onclick = () => { readFilters(); st.filters.splice(+b.dataset.rm, 1); if (!st.filters.length) st.filters.push({ type: 'name', op: 'contains', value: '' }); render(); });
    $('#fs-add').onclick = () => { readFilters(); st.filters.push({ type: 'extension', op: 'is', value: '' }); render(); };
    $('#fs-root').onchange = () => { readFilters(); render(); };
    $$('.frow input', c).forEach((i) => i.onkeydown = (e) => { if (e.key === 'Enter') run(); });

    $$('.list-head button', files).forEach((b) => b.onclick = () => { const k = b.dataset.k; st.sort = { k, d: st.sort.k === k ? -st.sort.d : k === 'size' || k === 'modified' ? -1 : 1 }; render(); });
    files.onclick = (e) => { const row = e.target.closest('.row[data-path]'); if (!row) return; const p = row.dataset.path; st.checked.has(p) ? st.checked.delete(p) : st.checked.add(p); render(); };
    files.ondblclick = (e) => { const row = e.target.closest('.row[data-path]'); if (row) api('POST', 'reveal', null, { path: row.dataset.path }); };

      showMenu([{ label: 'Open', action: () => api('POST', 'open', null, { path: p }) }, { label: 'Show in Finder', action: () => api('POST', 'reveal', null, { path: p }) }, { label: 'Copy Path', action: () => copy(p) }, '-', { label: 'Move to Trash', danger: true, action: () => del([p]) }], e.clientX, e.clientY); };

      const ren = $('#fs-ren'); if (ren) ren.onclick = async () => {
        const r0 = sel[0]; const m = await modal({ title: 'Rename', input: true, inputValue: r0.name, buttons: [{ label: 'Cancel', value: null }, { label: 'Rename', value: true, primary: true }] });
        if (!m || !m.input || m.input === r0.name) return;

      };
    }
  };
  async function del(paths) {
    const r = await trashPaths(paths, 'File Search').catch(showError);

  }
  async function run() {

    if (!filters.length) return toast('Type something to search for first', true);

/* ============================================================ LIPO */
async function lipoApps(paths, prune) {
  const ok = await confirmDlg(`Lipo ${plural(paths.length, 'app')}?`, `Deskmart removes the ${S.nativeArch === 'arm' ? 'Intel' : 'Apple silicon'} code from ${paths.length === 1 ? 'this app' : 'these apps'}, keeping only what this Mac runs. Each part keeps its own signature, so the apps still open. Their next update puts the full version back.`, 'Lipo', false);
  if (!ok) return false;
  try {
    const { task } = await api('POST', 'lipo/thin', null, { paths, prune: !!prune });
    setStatus('Slimming apps…');
    const t = await follow(task, { onProgress: (p) => p && p.total && setStatus(`Slimming ${p.step || ''} (${p.done + 1} of ${p.total})…`) });
    const r = t.result || {};
    toast(r.failed && r.failed.length ? `Saved ${fmtSize(r.saved)}; ${r.failed.length} couldn't be slimmed: ${r.failed[0].error}` : `Saved ${fmtSize(r.saved)}`, r.failed && r.failed.length > 0);
    S.apps = null; refreshDisk();
    return true;
  } catch (e) { showError(e); return false; }
}

  rerender = render; render();
}
/** Release notes are HTML from the developer: keep text formatting only. */
function sanitize(html) {
  const doc = new DOMParser().parseFromString(String(html), 'text/html');
  const ok = new Set(['P', 'UL', 'OL', 'LI', 'B', 'STRONG', 'I', 'EM', 'H1', 'H2', 'H3', 'H4', 'BR', 'CODE', 'PRE', 'BLOCKQUOTE', 'SPAN', 'DIV']);
  const walk = (n) => [...n.childNodes].map((c) => c.nodeType === 3 ? esc(c.textContent) : c.nodeType === 1 ? (ok.has(c.tagName) ? `<${c.tagName.toLowerCase()}>${walk(c)}</${c.tagName.toLowerCase()}>` : walk(c)) : '').join('');
  return walk(doc.body);
}

    }
    $$('[data-a]', c).forEach((b) => b.onclick = async (e) => {
      const row = b.closest('[data-name]'); const name = row.dataset.name; const cask = row.dataset.cask === '1'; const a = b.dataset.a;
      const p = st.installed && [...st.installed.formulae, ...st.installed.casks].find((x) => x.name === name && (x.kind === 'cask') === cask);
      if (a === 'upgrade') return act('upgrade', [name], cask, { done: `Upgraded ${name}` });
      if (a === 'install') return act('install', [name], cask, { done: `Installed ${name}` });
      if (a === 'info') return brewInfo(name, cask, act);
      if (a === 'more') showMenu([
        { label: 'Info…', action: () => brewInfo(name, cask, act) },
        p && p.homepage ? { label: 'Homepage', action: () => api('POST', 'openurl', null, { url: p.homepage }) } : null,
        p && !cask ? { label: p.pinned ? 'Unpin' : 'Pin', action: () => act(p.pinned ? 'unpin' : 'pin', [name], false, { done: p.pinned ? 'Unpinned' : 'Pinned' }) } : null,
        { label: 'Reinstall', action: () => act('reinstall', [name], cask, { done: `Reinstalled ${name}` }) },
        '-',
        { label: 'Uninstall…', danger: true, action: () => act('uninstall', [name], cask, { confirm: `Uninstall ${name}?`, label: 'Uninstall', danger: true, done: `Uninstalled ${name}` }) },
        cask ? { label: 'Uninstall and Zap…', danger: true, action: () => act('uninstall', [name], true, { zap: true, confirm: `Uninstall ${name} and zap its files?`, message: 'Zap also removes the settings and caches the cask lists. Shared files can be affected.', label: 'Zap', danger: true, done: `Zapped ${name}` }) } : null,
      ], 0, 0, b);
    });
  };
  rerender = render; render();
}
async function brewInfo(name, cask, act) {
  let i;
  try { i = await api('GET', 'brew/info', { name, cask: cask ? 1 : 0 }); } catch (e) { return showError(e); }
  const kv = [['Name', cask ? (i.name || [])[0] || i.token : i.name], ['Version', cask ? i.version : i.versions && i.versions.stable], ['Description', i.desc], ['Homepage', i.homepage], ['Tap', i.tap], ['License', i.license],
    ['Dependencies', !cask && i.dependencies && i.dependencies.length ? i.dependencies.join(', ') : null], ['Installed', cask ? i.installed : i.installed && i.installed.length ? i.installed.map((x) => x.version).join(', ') : null]].filter(([, v]) => v);
  const installed = cask ? !!i.installed : !!(i.installed && i.installed.length);
  const r = await modal({ title: name, wide: true, html: `<dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`,
    buttons: [i.homepage ? { label: 'Homepage', value: 'home', left: true } : null, { label: 'Close', value: null }, installed ? null : { label: 'Install', value: 'install', primary: true }].filter(Boolean) });
  if (r && r.value === 'home') api('POST', 'openurl', null, { url: i.homepage });
  if (r && r.value === 'install') act('install', [name], cask, { done: `Installed ${name}` });
}

async function pkgDetail(p, reload) {
  const scrimP = modal({ title: p.id, wide: 'x', html: `<dl class="kv"><dt>Version</dt><dd>${esc(p.version)}</dd><dt>Installed</dt><dd>${fmtDate(p.installed)}</dd><dt>Location</dt><dd>${esc(p.volume)}${esc(p.location)}</dd><dt>Receipts</dt><dd>${p.receipts.map(esc).join('<br>')}</dd></dl><div id="pk-files">${loadingBox('Reading the bill of materials…')}</div>`,
    buttons: [{ label: 'Forget Package…', value: 'forget', left: true }, { label: 'Close', value: null }, { label: 'Move Files to Trash', value: 'trash', primary: true, danger: true }],
    onOpen: async (form) => {
      try {
        const r = await api('GET', 'package/files', { id: p.id });
        p._files = r.files; p._checked = new Set(r.files.map((f) => f.path));
        const draw = () => { $('#pk-files', form).innerHTML = `<p>${r.present} of ${plural(r.total, 'file')} it installed are still here.${r.files.length ? ' These can be removed:' : ' You can forget this package.'}</p>${r.files.length ? `<div class="dlist" id="pk-rows">${fileRows(r.files, p._checked)}</div>` : ''}`;
          const rows = $('#pk-rows', form); if (rows) wireFileRows(rows, () => r.files, p._checked, draw); };
        draw();
      } catch (e) { $('#pk-files', form).innerHTML = `<p class="err">${esc(e.message)}</p>`; }
    } });
  const r = await scrimP;
  if (!r) return;
  if (r.value === 'trash') {
    const paths = (p._files || []).filter((f) => p._checked.has(f.path)).map((f) => f.path);
    if (!paths.length) return toast('Nothing selected');
    const res = await trashPaths(paths, p.id).catch(showError);
    if (res && res.moved) { const f = await confirmDlg('Forget the package too?', `Removes the install record for ${p.id}, so it stops showing here. Needs your Mac password.`, 'Forget'); if (f) await forget(); reload(); }
  } else if (r.value === 'forget') {
    const f = await confirmDlg(`Forget ${p.id}?`, 'macOS stops tracking this package. Its files stay where they are. Needs your Mac password.', 'Forget', true);
    if (f) { await forget(); reload(); }
  }
  async function forget() { try { await api('POST', 'package/forget', null, { id: p.id }); toast(`Forgot ${p.id}`); } catch (e) { showError(e); } }
}

  ['enhanced', 'Enhanced', 'Everything in Strict, plus partial name matches. May find a few unrelated files in some cases.'],

      ${toggle('sentinel', 'Sentinel', 'Watch the Trash: when you drag an app there yourself, Deskmart moves its leftover files to the Trash too. Runs in the background using very little memory.', st.sentinel)}
      ${toggle('cli', 'Terminal command', 'Adds <code>deskmart</code> to /usr/local/bin so you can run <code>deskmart uninstall Foo</code> in Terminal.', st.cli)}
